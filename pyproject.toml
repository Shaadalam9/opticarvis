[project]
name = "opticarvis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bs4>=0.0.2",
    # numpy and pillow are imported directly (numpy at module level in 8 files,
    # PIL inside the gate/render paths). They would arrive transitively via
    # opencv-python and torchvision, but a direct import deserves a direct
    # declaration -- otherwise a dependency dropping them breaks us silently.
    "numpy>=2.4.6",
    "opencv-python>=4.13.0.92",
    "pandas>=3.0.3",
    "pillow>=12.2.0",
    "plotly>=6.7.0",
    "pycountry>=26.2.16",
    "requests>=2.34.2",
    "tqdm>=4.67.3",
    # AV pipeline (src/). Floors are the versions the pipeline is known to run
    # on; uv.lock pins the exact build, so `uv sync --frozen` is reproducible.
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "transformers>=5.14.1",
    "ultralytics>=8.4.103",
    "scikit-learn>=1.9.0",
    "accelerate>=1.14.0",
    "physical-ai-av>=0.2.2",
    # Spatially balanced city selection (src/city_sampler.py). Developed here
    # first, then extracted so it is usable — and citable — on its own:
    # github.com/M-Colley/lpm-sampling. Pinned to a tag; uv.lock records the
    # exact commit.
    "lpm-sampling>=0.1.0",
    # ByteTrack's linear assignment step. Nothing in src/ imports it, but
    # ultralytics does not declare it either -- model.track() imports it lazily
    # and, when it is absent, pip installs it mid-render from inside the
    # process. Declaring it keeps a network install out of a 100 city batch and
    # turns a missing wheel into a lock failure instead of a crash at the first
    # tracked frame. Required as long as OPTICARVIS_TRACKER stays bytetrack.
    "lap>=0.5.12",
]

# PyPI ships a CPU-only torch wheel for Windows -- its win_amd64 wheel carries
# no CUDA dependencies at all (they are gated on sys_platform == 'linux'). A
# plain PyPI torch would therefore silently downgrade this project to CPU on
# the Windows dev machine, so Windows is pointed at the CUDA 12.8 index, which
# is what an RTX 5080 (Blackwell, sm_120) needs.
#
# Linux is deliberately left on PyPI, and NOT because the cu128 index lacks ARM
# builds -- it does publish manylinux_2_28_aarch64 wheels, which is precisely
# what makes pinning them dangerous: it would resolve cleanly and look correct
# while installing a CUDA 12.8 build. From torch 2.11.0 the PyPI Linux wheels
# are CUDA 13.0 builds, which is what an sm_121 part (DGX Spark / GB10) wants.
[tool.uv]
# The lock is generated on Windows but deployed to Linux aarch64 (DGX Spark).
# By default uv only guarantees wheels for the locking platform, so a re-lock
# could pin a version with no aarch64 wheel and fail at deploy time on Spark.
# This forces the resolver to backtrack until every package has one, turning
# that into a lock-time failure here instead.
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
# Not on PyPI yet, so it resolves from the public repo. Pinned to a tag rather
# than a branch: a moving branch would let a dependency change under a
# `uv sync --frozen` that is supposed to be reproducible.
lpm-sampling = { git = "https://github.com/M-Colley/lpm-sampling.git", tag = "v0.1.0" }
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]
